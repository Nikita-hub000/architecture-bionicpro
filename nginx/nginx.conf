worker_processes  1;

events { worker_connections 1024; }

http {
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=reports_cache:20m max_size=1g inactive=60m use_temp_path=off;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  include /etc/nginx/conf.d/*.conf;
}